# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi đúng một thông tin còn thiếu hoặc xin xác nhận trước action. Dùng text khi thiếu asset ID/employee ID; dùng choice chỉ cho lựa chọn hữu hạn như production hoặc staging; dùng yes_no để xác nhận payload ticket hiện tại. Tool này không thực hiện action."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn nêu chính xác thông tin cần bổ sung hoặc toàn bộ payload cần xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text cho mã/giá trị tự do; yes_no cho xác nhận action; choice cho enum mơ hồ"}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ điền khi response_type=choice; các giá trị hợp lệ để người dùng chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm bài hướng dẫn/how-to hoặc troubleshooting trong knowledge base. Dùng category khớp chủ đề mới nhất; không dùng cho service status, device diagnostics hoặc khi người dùng chỉ yêu cầu format findings đã có."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung trong đúng environment. Gọi riêng một lần cho mỗi cặp service/environment được yêu cầu. Nếu environment được nêu rõ phải giữ nguyên; nếu mơ hồ ngoài production/staging thì dùng clarify thay vì tự đoán."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra một asset cụ thể. Cần asset_id do người dùng cung cấp; không tự đoán. Chọn check sát yêu cầu: Wi-Fi/network→network, VPN→vpn, bảo mật→security, phần cứng→hardware, phần mềm→software; chỉ dùng all khi người dùng yêu cầu kiểm tra tổng thể. Gọi riêng cho từng asset."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu trạng thái tài khoản hoặc thiết bị được cấp của đúng employee_id. Cần mã nhân viên cụ thể; dùng mã được sửa gần nhất và dùng clarify text nếu còn thiếu."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Bắt buộc dùng khi người dùng yêu cầu trình bày/format các findings đã cung cấp thành báo cáo. Chỉ format dữ liệu sẵn có, không gọi lại tool thu thập. Chọn đúng template brief/technical/handoff và giữ nguyên incident_title người dùng nêu."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Action ghi dữ liệu để tạo ticket sau khi người dùng đã xác nhận rõ toàn bộ payload hiện tại ở một lượt sau. Không gọi ngay từ yêu cầu tạo ban đầu; khi chưa xác nhận hoặc payload vừa đổi, dùng clarify yes_no. confirmed chỉ được true cho payload không đổi đã được xác nhận."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
